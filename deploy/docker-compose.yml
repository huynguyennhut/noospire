version: '3.8'

services:
  # ===========================================================================
  # NOOSFORGE BACKEND API & SCAN ORCHESTRATOR
  # ===========================================================================
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: noosforge-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - NOOSPIRE_DATABASE_URL=sqlite:////app/storage/noospire.db
      - ENVIRONMENT=production
    volumes:
      - ../storage:/app/storage
      - ../noospire.db:/app/noospire.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/system/resources"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - noosforge-net

  # ===========================================================================
  # NOOSFORGE FRONTEND SOC CONSOLE (NEXT.JS 14 LIQUID GLASS)
  # ===========================================================================
  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/Dockerfile.frontend
    container_name: noosforge-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - noosforge-net

  # ===========================================================================
  # CLOUDFLARE ZERO TRUST ARGO TUNNEL (OPTIONAL / PRODUCTION)
  # Expose private host to dash.cloudflare.com without open inbound ports!
  # Set TUNNEL_TOKEN in your environment or .env file
  # ===========================================================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: noosforge-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-eyJhIjoiNTdlNzRjNmRiN2E1YmQ0NzQ4NzdmMjZjODQ5MDEwMDkiLCJ0IjoiODIzNDY0YTctM2JmMi00MTgyLWE0MGItY2IwZjFmY2ExOWY4IiwicyI6Ik9HVXdPV1UxTWprdE1UVmxOUzAwTVdJeUxUZ3pNak10TnpaaU16azBPV1UwT0RFNCJ9}
    depends_on:
      - frontend
    networks:
      - noosforge-net

networks:
  noosforge-net:
    driver: bridge
