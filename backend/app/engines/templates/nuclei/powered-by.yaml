id: noosforge-public-powered-by
info:
  name: Public response advertises framework metadata
  author: noosforge
  severity: info
  description: Captured public header metadata only; no vulnerable version or exploitation is established.
  tags: passive,headers,noosforge
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    matchers:
      - type: regex
        part: header
        regex:
          - '(?im)^x-powered-by:\s*[^\r\n]+\r?$'
